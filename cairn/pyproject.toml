[project]
name = "cairn"
version = "0.2.1"
description = "Fact-graph based collaborative exploration protocol"
authors = [
    { name = "leixiao", email = "1729888211@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "click>=8.1",
    "pyyaml>=6.0",
    "docker>=7.1.0",
    "requests>=2.32.3",
    "claude-agent-sdk==0.2.174",
    "pywinpty>=3.1.1 ; sys_platform == 'win32'",
    "jinja2>=3.1",
]

[project.scripts]
cairn = "cairn.cli:main"

[project.optional-dependencies]
desktop = [
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen==4.19.2",
    "httpx>=0.27",
    "pytest>=8.3",
]
packaging = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
