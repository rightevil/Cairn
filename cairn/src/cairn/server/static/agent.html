<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Cairn Agent 会话正文与可展开的工具执行记录。"><title>Cairn Agent 会话</title>
<link rel="stylesheet" href="/static/tokens.css"><link rel="stylesheet" href="/static/base.css"><link rel="stylesheet" href="/static/workspace.css"></head>
<body><header class="agent-header"><h1 id="title">Agent 会话</h1><span class="badge" id="status"></span><select id="channel" aria-label="输出通道"><option value="stdout">标准输出</option><option value="stderr">错误输出</option></select><label><input type="checkbox" id="raw"> 原始记录（敏感字段已隐藏）</label><a href="/" target="_blank" rel="noopener">开发黑板</a></header>
