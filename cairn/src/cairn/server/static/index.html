<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cairn · 项目工作台</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/workspace.css">
<script defer src="/static/vendor/dagre.min.js"></script><script defer src="/static/vendor/cytoscape.min.js"></script><script defer src="/static/vendor/cytoscape-dagre.js"></script>
<script defer src="/static/vendor/marked-18.0.14.umd.js"></script><script defer src="/static/vendor/purify-3.4.16.min.js"></script>
<script defer src="/static/agent-output.js"></script><script defer src="/static/development.js"></script><script defer src="/static/design.js"></script><script defer src="/static/workspace.js"></script><script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body x-data="cairnApp()" @keydown.escape.window="if (folderOpen) cancelFolder(); else if (deleteTarget) { if (!deletingProject) deleteTarget = null; } else { showNewProject = false; developmentArtifact.open = false; }">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 4h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
<symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
<symbol id="icon-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
<symbol id="icon-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10ZM13 3v7h7M8 14h8M8 17h5"/></symbol>
<symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
</svg>
<div class="shell" :inert="showNewProject || developmentArtifact.open || !!deleteTarget">
<aside class="rail" aria-label="项目导航">
  <div class="brand"><span class="brand-mark">c</span><span>CAIRN</span></div>
  <a href="#" class="nav-item" :class="{active: view === 'list'}" :aria-current="view === 'list' ? 'page' : null" title="项目列表"><svg class="icon"><use href="#icon-grid"/></svg><span>项目列表</span></a>
  <div class="nav-label">我的项目</div>
  <nav class="project-nav" aria-label="具体项目"><template x-for="p in projects" :key="p.id"><div>
    <a @click="if (selectedProjectId === p.id) { agentSessionKey = ''; setStage(project?.project.development?.phase === 'design' ? 'design' : 'development', false); }" :href="'#' + new URLSearchParams({project:p.id})" class="nav-item" :class="{active:selectedProjectId === p.id}" :title="p.title"><svg class="icon"><use href="#icon-folder"/></svg><span class="nav-name" x-text="p.title"></span><i class="dot" :class="{live:p.progress.running > 0}"></i></a>
    <div class="session-tree" x-show="selectedProjectId === p.id"><button class="session-item" @click="setStage('development')" :class="{active:sideTab === 'development' && !agentSessionKey}">开发黑板</button><template x-for="session in projectSessions()" :key="session.key"><button class="session-item" @click="selectAgentSession(session.key)" :class="{active:session.main ? !agentSessionKey && sideTab === 'design' : agentSessionKey === session.key}" :title="session.title + (session.session ? ' · ' + session.session : '')"><i class="dot" :class="{live:session.state === 'running'}"></i><span x-text="session.title + (session.main ? '' : ' · ' + (session.runs.at(-1)?.intent_id || ''))"></span></button></template></div>
  </div></template><p x-show="!projects.length && !loadingList" class="muted nav-label">暂无项目</p></nav>
  <div class="rail-footer"><button class="nav-item" @click="showNewProject = true; createError = ''" title="创建项目"><svg class="icon"><use href="#icon-plus"/></svg><span>创建项目</span></button><p class="local-status"><i class="dot" :class="{live:!connectionError}"></i><span x-text="connectionError ? '连接待恢复' : '本地工作台'"></span></p></div>
</aside>
<main class="page">
  <div class="error-banner" x-show="connectionError" x-cloak role="alert" x-text="connectionError"></div>
  <section class="projects-page" x-show="view === 'list'" x-cloak>
    <header class="page-heading"><div><div class="eyebrow">WORKSPACE</div><h1>项目列表</h1><p>从想法到交付，在同一个工作台里推进。</p></div><button class="primary" @click="showNewProject = true; createError = ''"><svg class="icon"><use href="#icon-plus"/></svg>创建项目</button></header>
    <div class="list-toolbar"><span class="muted" x-text="'全部项目 · ' + projects.length"></span><input class="search" x-model="projectSearch" type="search" placeholder="搜索项目…" aria-label="搜索项目"></div>
    <div x-show="loadingList" class="loading">正在读取项目…</div>
    <div class="project-grid"><template x-for="p in filteredProjects()" :key="p.id">
      <div class="project-card-wrap"><button class="project-card" @click="navigateProject(p.id)" :aria-label="'打开项目 ' + p.title">
        <div class="card-head"><span class="folder-tile"><svg class="icon"><use href="#icon-folder"/></svg></span><span class="card-title" x-text="p.title"></span></div>
        <span class="badge" :class="{gray:p.status === 'completed',amber:p.status === 'stopped'}" x-text="phaseLabel(p) + (p.status === 'stopped' ? ' · 已暂停' : '')"></span>
        <div class="card-detail"><span x-text="p.development?.phase === 'design' ? stageLabel(p.progress.stage) : '已验证任务'"></span><span x-text="p.development?.phase === 'design' ? (p.progress.questions ? p.progress.questions + ' 项待你确认' : '方案讨论中') : p.progress.verified + ' / ' + p.progress.total"></span></div>
        <div class="progress-track" x-show="p.development?.phase !== 'design'" role="progressbar" :aria-label="p.title + ' 验收进度'" :aria-valuenow="progressPercent(p.progress)" aria-valuemin="0" aria-valuemax="100"><span :style="'width:' + progressPercent(p.progress) + '%'"></span></div>
        <div class="card-footer"><span x-text="p.progress.running ? p.progress.running + ' 个 Agent 正在工作' : p.status === 'completed' ? '开发已完成' : '打开工作台'"></span><svg class="icon"><use href="#icon-arrow"/></svg></div>
      </button><button class="quiet project-delete" @click="requestDeleteProject(p)" :aria-label="'删除项目 ' + p.title">删除项目</button></div>
    </template></div>
    <div class="empty" x-show="!loadingList && !projects.length && !connectionError"><div class="empty-symbol"><svg class="icon"><use href="#icon-folder"/></svg></div><h2>从一个项目文件夹开始</h2><p class="muted">选择文件夹后，直接和设计 Agent 讨论你的想法。</p><button class="secondary" @click="showNewProject = true">创建第一个项目</button></div>
    <p class="empty" x-show="projects.length && !filteredProjects().length">没有找到匹配的项目。</p>
  </section>
  <div class="loading" x-show="view === 'graph' && loadingProject">正在打开项目…</div>
  <div class="empty" x-show="view === 'graph' && !project && !loadingProject" x-cloak><h2>暂时无法打开项目</h2><a href="#" class="secondary">返回项目列表</a></div>
  <template x-if="view === 'graph' && project"><div class="page">
    <header class="workspace-header">
      <div class="workspace-heading"><h1 x-text="project.project.title"></h1><small x-text="statusLabel(project.project.status)"></small></div>
      <nav class="stage-tabs" aria-label="项目阶段"><button @click="setStage('design')" :class="{active:sideTab === 'design'}" :aria-current="sideTab === 'design' ? 'page' : null">方案设计</button><button @click="setStage('development')" :class="{active:sideTab === 'development'}" :aria-current="sideTab === 'development' ? 'page' : null">开发</button></nav>
      <div class="header-actions"><span class="badge status-text" x-text="phaseLabel(project.project)"></span><button class="quiet" @click="panelOpen = !panelOpen; updateGraph()" :aria-expanded="panelOpen" aria-label="切换详情面板" title="切换详情面板"><svg class="icon"><use href="#icon-panel"/></svg></button></div>
    </header>
    <div class="workspace-content" x-show="sideTab === 'design' && !selectedAgentSession()">
      <section class="main-work" aria-label="方案设计对话">
        <div class="design-history" x-ref="designHistory" role="log" aria-label="设计对话记录">
          <div class="conversation-heading"><div><h2>方案设计</h2><p>目标、需求、设计与实施计划</p></div><span class="badge" x-text="stageLabel(designDraft.stage)"></span></div>
          <div class="design-welcome" x-show="!designEntries.length"><div class="eyebrow">LET'S SHAPE IT</div><h2>先聊聊，你想做什么？</h2><p>直接描述你的想法，或者说说现有项目遇到的问题。设计 Agent 会查看项目、梳理方案，并逐步与你确认关键决策。</p></div>
          <template x-for="entry in visibleDesignEntries()" :key="entry.id"><article class="message" :class="{user:entry.role === '你',activity:entry.role === '工作流'}"><div class="message-role" x-show="entry.role !== '工作流' && entry.kind !== 'tool'"><span x-text="entry.role === 'Claude' ? '设计 Agent' : entry.role"></span><small class="delivery-status" x-show="entry.role === '你'" x-text="deliveryLabel(entry.id)"></small></div><template x-if="entry.kind === 'tool'"><div @toggle.capture="if ($event.target.matches('details.tool-call')) toolOpen[entry.id] = $event.target.open" x-html="toolHTML(entry)"></div></template><template x-if="entry.role === 'Claude' && entry.kind !== 'tool'"><div class="message-body markdown" x-html="designMarkdown(entry.text)"></div></template><template x-if="entry.role !== 'Claude' && entry.kind !== 'tool'"><pre class="message-body" x-text="entry.text"></pre></template></article></template>
          <p class="muted" x-show="designBusy()" x-text="designActivityLabel()"></p>
        </div>
        <div class="questions" x-show="canDesign()"><template x-for="q in pendingQuestions().slice(0, 1)" :key="q.id"><section class="question"><p class="muted question-progress" x-text="'还有 ' + pendingQuestions().length + ' 题待回答 · 每次保存一题，全部回答后 Agent 才会继续'"></p><h3 x-text="q.text"></h3><p class="recommendation" x-show="q.recommendation" x-text="'建议：' + q.recommendation"></p><div class="options"><template x-for="option in q.options" :key="option"><button @click="designAnswers[q.id] = option" :class="{active:designAnswers[q.id] === option}" :disabled="designBusy() || designSending" x-text="option"></button></template></div><form class="answer-row" @submit.prevent="sendDesign(q)"><input x-ref="questionAnswer" x-model="designAnswers[q.id]" :aria-label="'回答：' + q.text" placeholder="选择选项，或直接写下你的回答" :disabled="designBusy() || designSending"><button class="secondary" :disabled="designSending || designBusy() || !designAnswers[q.id]?.trim()" x-text="pendingQuestions().length > 1 ? '保存并继续' : '提交本轮回答'"></button></form></section></template></div>
        <footer class="composer">
          <p class="error" x-show="designError || developmentError" x-text="designError || developmentError" role="alert"></p>
          <div class="command-menu" x-show="designCommands().length && canDesign()" role="listbox" aria-label="可用斜杠命令"><template x-for="(command,index) in designCommands()" :key="command.name"><button @click="designInput = '/' + command.name + ' '; $refs.designComposer.focus()" :class="{active:index === designCommandIndex}" role="option" :aria-selected="index === designCommandIndex" x-text="'/' + command.name + '　' + (command.description || '')"></button></template></div>
          <div class="command-menu" x-show="fileSuggestions.length && canDesign()" role="listbox" aria-label="项目文件引用"><template x-for="(file,index) in fileSuggestions" :key="file"><button @click="chooseFile(file)" :class="{active:index === fileIndex}" role="option" :aria-selected="index === fileIndex" x-text="file"></button></template></div>
          <div class="composer-box"><textarea x-ref="designComposer" x-model="designInput" @input="onDesignInput()" @keydown="composerKey($event)" aria-label="设计消息" placeholder="描述你的想法，或者继续讨论…" rows="2" :disabled="designSending"></textarea><div class="composer-footer"><small x-text="canDesign() ? (designBusy() ? '工作中可继续发送方向引导，默认不中断' : '/ 命令　@ 项目文件 · Enter 发送') : project.project.development?.phase === 'execution' ? '方案已交付，开发阶段可在黑板提出调整。' : designDraft.candidate.digest ? '当前版本已冻结，请在方案面板查看评审。' : '项目已暂停。'"></small><div class="composer-actions"><button class="quiet" x-show="designBusy()" @click="interruptDesign()">中断回复</button><button class="primary send" @click="sendDesign()" :disabled="!canDesign() || designSending || !designInput.trim()">发送 <svg class="icon"><use href="#icon-arrow"/></svg></button></div></div></div>
        </footer>
      </section>
      <aside class="side-panel design-panel" x-show="panelOpen" aria-label="方案与评审">
        <div class="handoff-bar">
          <div class="panel-heading"><h2 x-text="designDraft.stage === 'plan' ? '最终方案确认与交付' : '阶段冻结与评审'"></h2><button class="quiet" @click="panelOpen = false" aria-label="收起方案面板">×</button></div>
          <p class="muted" x-text="stageLabel(designDraft.stage) + ' · 草案 v' + designDraft.version"></p>
          <p role="status" x-text="designReview ? designReviewStatus() : '准备方案，完成后送独立评审'"></p>
          <button class="secondary" x-show="!designDraft.candidate.digest && project.project.development?.phase === 'design'" @click="designAction('candidate')" :disabled="!canSubmitDesign()" x-text="designDraft.stage === 'plan' ? '冻结计划并提交独立评审' : '冻结当前阶段并送独立评审'"></button>
          <button class="primary" x-show="designDraft.candidate.digest && designReview?.verdict !== 'pending' && project.project.development?.phase === 'design'" @click="designAction('reopen')" :disabled="designSending || designBusy() || designReview?.run?.state === 'running'">交给设计 Agent 继续修改</button>
          <button class="primary" x-show="canRecoverDesignRevision()" @click="designAction('reopen')" :disabled="designSending">根据上一轮评审恢复修订</button>
          <button class="primary" x-show="designDraft.candidate.review === 'approve' && designDraft.candidate.kind === 'stage'" @click="designAction('continue')" :disabled="designSending || project.project.status !== 'active'" x-text="'确认阶段评审并继续' + stageLabel(nextDesignStage())"></button>
          <button class="primary" x-show="designDraft.candidate.review === 'approve' && designDraft.stage === 'plan' && project.project.development?.phase === 'design'" @click="designAction('publish')" :disabled="designSending || project.project.status !== 'active'" x-text="'确认方案 v' + designDraft.version + ' 并开始开发'"></button>
          <button class="inline-link" x-show="project.project.status === 'stopped'" @click="resumeDevelopment()">继续项目</button>
          <details x-show="!designDraft.candidate.digest && designReadiness.issues.length"><summary class="muted">送审条件与待解决项</summary><template x-for="issue in designReadiness.issues" :key="issue"><p class="muted" x-text="issue"></p></template></details>
        </div>
        <nav class="board-tabs design-panel-tabs" aria-label="方案资料"><template x-for="tab in ['review','documents','decisions','changes']" :key="tab"><button @click="designPanelTab = tab" :class="{active:designPanelTab === tab}" x-text="({review:'评审与修订',documents:'方案文档',decisions:'决策与回答',changes:'本轮变化'})[tab]"></button></template></nav>
        <div class="design-panel-body">
          <section x-show="designPanelTab === 'review'" aria-label="独立评审进度">
            <p class="muted" x-show="!designReview">送审后，评审报告会显示在这里；查看后可直接在上方交给设计 Agent 修订。</p>
            <template x-if="designReview"><div><p class="muted" x-text="'冻结 v' + designReview.version + ' · ' + stageLabel(designReview.stage)"></p><button class="inline-link" x-show="designReview.run" @click="selectRunSession(designReview.run)">查看评审实时输出 →</button><button class="inline-link" x-show="designReview.summary" @click="openDesignReviewReport()">放大查看完整评审报告</button><article class="markdown" x-html="designMarkdown(designReview.summary || '')"></article><p class="muted" x-show="designReview.retry_at" x-text="'重试时间：' + developmentTime(designReview.retry_at)"></p></div></template>
            <p class="muted" x-show="designDraft.work.length" x-text="'依赖分层最大同层任务数：' + planParallelWidth() + '；实际并行还受模型容量与共享资源限制。'"></p>
            <p class="muted" x-show="designDraft.prepared_materials?.length" x-text="'已归档交付材料：' + designDraft.prepared_materials?.length + ' 项，开发时自动落地。'"></p>
          </section>
          <section x-show="designPanelTab === 'documents'"><p class="muted" x-show="designArtifactDirectory">项目内保存位置：<span x-text="designArtifactDirectory"></span></p><template x-for="error in designDocumentErrors" :key="error"><p class="error" x-text="error"></p></template><template x-for="(content,name) in designDraft.documents" :key="name"><button class="doc-row" @click="designDocument = name"><svg class="icon"><use href="#icon-file"/></svg><span x-text="stageLabel(name)"></span></button></template><button class="inline-link" x-show="designDocument" @click="openDesignDocument(designDocument)">放大阅读文档</button><article class="markdown" x-html="designMarkdown(designDocuments[designDocument] || '')"></article></section>
          <section x-show="designPanelTab === 'decisions'"><h3>已确认决策</h3><template x-for="(decision,index) in designDraft.decisions" :key="index"><p class="decision" x-text="decision"></p></template><h3>已回答问题</h3><template x-for="q in designDraft.questions.filter(q => q.answer !== null)" :key="q.id"><p class="decision" x-text="q.text + '：' + q.answer"></p></template></section>
          <section x-show="designPanelTab === 'changes'"><p class="muted">相对上一轮冻结版本；关键决策的改变仍需你明确回答，不由评审自动批准。</p><template x-if="designReview?.changes"><div><p x-text="'变更文档：' + (designReview.changes.documents.join('、') || '无')"></p><p x-text="'变更任务：' + (designReview.changes.tasks.join('、') || '无')"></p><template x-for="decision in designReview.changes.decisions_added" :key="decision"><p class="decision" x-text="'新增：' + decision"></p></template><template x-for="decision in designReview.changes.decisions_removed" :key="decision"><p class="decision" x-text="'移除：' + decision"></p></template></div></template></section>
        </div>
      </aside>
    </div>


    <div class="workspace-content" x-show="selectedAgentSession()">
      <section class="main-work" aria-label="Agent 会话">
        <div class="design-history" x-ref="agentHistory" role="log" aria-label="独立 Agent 对话记录"><div class="conversation-heading"><div><h2 x-text="selectedAgentSession()?.title || 'Agent 会话'"></h2><p>独立会话 · 查看过程不会启动新任务</p></div><button class="secondary" @click="agentSessionKey = ''; sideTab = 'design'; designPanelTab = 'review'">返回主会话与评审</button></div>
          <p class="error" x-show="agentError" x-text="agentError"></p><p class="muted" x-show="!agentEntries().length">等待会话正文与工具活动…</p>
          <template x-for="entry in agentEntries()" :key="entry.id"><article class="message" :class="{activity:entry.role === '工具'}"><div class="message-role" x-show="entry.kind !== 'tool'" x-text="entry.role === 'Agent' ? selectedAgentSession()?.title : entry.role"></div><template x-if="entry.kind === 'tool'"><div @toggle.capture="if ($event.target.matches('details.tool-call')) toolOpen[entry.id] = $event.target.open" x-html="toolHTML(entry)"></div></template><template x-if="entry.kind !== 'tool'"><div class="message-body markdown" x-html="designMarkdown(entry.text)"></div></template></article></template>
        </div>
        <footer class="composer"><p class="muted">此会话只读。方向调整请回方案设计主会话；开发调整请在黑板提交建议或指令。</p></footer>
      </section>
      <aside class="side-panel" x-show="panelOpen"><div class="panel-heading"><h2>会话详情</h2></div><template x-for="run in selectedAgentSession()?.runs || []" :key="run.id"><section class="panel-section"><p x-text="developmentRole(run.role, run)"></p><p x-text="run.worker + ' · ' + run.intent_id"></p><p x-text="developmentRunStatus(run)"></p><small x-text="'开始：' + developmentTime(run.started_at)"></small><p class="muted" x-text="'最近心跳：' + developmentTime(run.heartbeat_at)"></p></section></template></aside>
    </div>
    <div class="workspace-content" x-show="sideTab === 'development' && !selectedAgentSession()">
      <div class="gate" x-show="project.project.development?.phase === 'design'"><div class="empty"><div class="empty-symbol"><svg class="icon"><use href="#icon-grid"/></svg></div><h2>先把方案讨论清楚</h2><p class="muted">方案通过评审并由你确认后，开发任务会直接出现在黑板中。</p><button class="secondary" @click="setStage('design')">回到方案设计</button></div></div>
      <section class="main-work" x-show="project.project.development?.phase !== 'design'" aria-label="开发黑板">
        <div class="summary-bar"><div class="summary-stat">已验证任务<strong x-text="projectProgress().verified + ' / ' + projectProgress().total"></strong><div class="progress-track"><span :style="'width:' + progressPercent(projectProgress()) + '%'"></span></div></div><div class="summary-stat">当前里程碑<strong x-text="project.project.development?.milestone || '项目开发'"></strong></div><div class="summary-stat">Agent<strong x-text="runningDevelopmentRuns().length + ' 个运行中'"></strong></div><div class="summary-stat">项目状态<strong x-text="statusLabel(project.project.status)"></strong></div><button class="quiet" @click="stopDevelopment()" x-show="project.project.development && project.project.status === 'active'">暂停开发</button><button class="secondary" @click="resumeDevelopment()" x-show="project.project.status === 'stopped'">继续开发</button></div>
        <p class="error-banner" x-show="developmentError" x-text="developmentError" role="alert"></p><p class="error-banner" x-show="project.project.development?.wait_reason" x-text="project.project.development?.wait_reason"></p>
        <div class="board">
          <header class="board-toolbar"><nav class="board-tabs" aria-label="黑板视图"><button @click="boardTab = 'graph'; updateGraph()" :class="{active:boardTab === 'graph'}">开发黑板</button><button @click="boardTab = 'tasks'" :class="{active:boardTab === 'tasks'}">任务与依赖</button><button @click="boardTab = 'facts'" :class="{active:boardTab === 'facts'}">开发事实</button></nav><div class="graph-tools"><select x-model="taskFilter" @change="graphFocus = ''; updateGraph()" aria-label="筛选任务状态"><option value="all">全部任务</option><option value="active">实现与审查中</option><option value="waiting">等待处理</option><option value="verified">已验证</option></select><template x-if="boardTab === 'graph'"><div class="graph-tools"><button class="secondary" @click="focusRunning()">定位当前运行</button><button class="quiet" @click="graphHistory = !graphHistory; updateGraph()" :aria-pressed="graphHistory">历史关系</button><button class="quiet" x-show="selection?.kind === 'intent'" @click="graphFocus = selection.id; updateGraph()">仅看关联</button><button class="quiet" @click="fitGraph()">显示全图</button></div></template></div></header>
          <div class="graph" x-ref="blackboard" x-show="boardTab === 'graph'" aria-label="任务依赖与事实关系图"></div>
          <div class="legend" x-show="boardTab === 'graph'"><span class="graph-state">⬡ 事实</span><span class="graph-state">□ 待执行</span><span class="graph-state running">▶ 实现中</span><span class="graph-state review">◇ 审查中</span><span class="graph-state verified">✓ 已验证</span><span class="graph-state waiting">! 等待／阻塞</span><span>实线：任务依赖；虚线：事实来源</span></div>
          <div class="board-list" x-show="boardTab === 'tasks'"><p class="muted" x-show="!developmentWork().length">任务会在方案确认后出现在这里。</p><template x-for="intent in visibleWork()" :key="intent.id"><button class="task-row" @click="selectItem('intent',intent.id)" :class="{selected:selection?.id === intent.id}"><div class="task-meta"><span x-text="intent.work.key || intent.id"></span><span class="badge" :class="{amber:['reviewing','approved','merged'].includes(intent.work.state)}" x-text="developmentPhase(intent)"></span></div><p class="task-title" x-text="developmentText(intent.description)"></p><p class="muted" x-text="taskWait(intent)"></p><p class="muted" x-text="intent.work.dependencies.length ? '依赖：' + intent.work.dependencies.join('、') : '无前置依赖'"></p></button></template></div>
          <div class="board-list" x-show="boardTab === 'facts'"><template x-for="fact in project.facts" :key="fact.id"><button class="task-row" @click="selectItem('fact',fact.id)"><span class="badge gray" x-text="fact.id === 'origin' ? '代码基线' : fact.id === 'goal' ? '项目目标' : fact.id"></span><pre class="task-title" x-text="fact.description"></pre></button></template></div>
        </div>
        <footer class="blackboard-composer"><form @submit.prevent="submitBlackboard()"><div class="input-row"><textarea x-model="developmentControl.content" rows="2" aria-label="黑板建议或指令" :disabled="controlSending" placeholder="对当前开发有什么建议或调整？"></textarea><select x-model="developmentControl.kind" aria-label="调整类型"><option value="suggestion">建议</option><option value="directive">指令</option></select><button class="primary send" :disabled="controlSending || !developmentControl.content.trim()">提交 <svg class="icon"><use href="#icon-arrow"/></svg></button></div><small>建议会经过独立评估；指令会在安全检查点调整执行。</small></form></footer>
      </section>
      <aside class="side-panel" x-show="panelOpen && project.project.development?.phase !== 'design'" aria-label="开发详情">
        <div class="panel-heading"><h2>开发详情</h2><button class="quiet" @click="panelOpen = false; updateGraph()" aria-label="收起开发详情"><svg class="icon"><use href="#icon-close"/></svg></button></div>
        <template x-if="selectedFact()"><section class="panel-section"><h3 x-text="'事实 · ' + selectedFact().id"></h3><pre x-text="selectedFact().description"></pre><button class="inline-link" @click="selection = null">清除选择</button></section></template>
        <template x-if="selectedIntent()"><section class="panel-section"><h3 x-text="'任务 · ' + selectedIntent().id"></h3><p class="selection-title" x-text="developmentText(selectedIntent().description)"></p><span class="badge" x-text="selectedIntent().work ? developmentPhase(selectedIntent()) : selectedIntent().to ? '已完成' : '待执行'"></span><p class="muted" x-text="taskWait(selectedIntent())"></p><p class="muted" x-show="selectedIntent().work?.scope" x-text="selectedIntent().work?.scope"></p><template x-for="item in selectedIntent().work?.acceptance || []" :key="item"><p class="decision" x-text="item"></p></template><template x-for="run in selectedRuns()" :key="run.id"><div class="run-card"><p x-text="developmentRole(run.role, run) + ' / ' + statusLabel(run.state) + (run.verdict ? ' / ' + reviewLabel(run.verdict) : '')"></p><button class="inline-link" @click="selectRunSession(run)">查看本次运行详情</button><template x-for="(evidence,index) in run.evidence" :key="index"><button class="doc-row" @click="viewDevelopmentEvidence(run,index)" x-text="'验收证据 · ' + evidence.kind"></button></template></div></template><button class="inline-link" x-show="taskActivity.next" @click="loadTaskActivity(selection.id,true)" :disabled="taskActivityLoading">加载更早运行</button><button class="inline-link" @click="selection = null">清除选择</button></section></template>
        <section class="panel-section"><h3 x-text="'当前 Worker（' + runningDevelopmentRuns().length + '）'"></h3><p class="muted" x-show="!runningDevelopmentRuns().length">当前没有执行中的 Agent。</p><template x-for="run in runningDevelopmentRuns()" :key="run.id"><div class="run-card"><div class="run-top"><span class="badge" x-text="developmentRunStatus(run)"></span><i class="dot live"></i></div><strong class="worker-task" x-text="runTask(run)?.key || '项目级活动'"></strong><p class="worker-task-title" :title="runTask(run)?.title" x-text="runTask(run)?.title || developmentRole(run.role, run)"></p><div class="run-id" x-text="run.worker + ' · ' + run.intent_id + (run.pid ? ' · PID ' + run.pid : '')"></div><small x-text="'开始：' + developmentTime(run.started_at)"></small><small x-text="'最近心跳：' + developmentTime(run.heartbeat_at)"></small><button class="quiet" @click="selectItem('intent',runTask(run)?.id || run.intent_id)">查看任务与运行记录</button></div></template></section>
        <section class="panel-section"><h3>建议与指令</h3><p class="muted" x-show="!project.hints.length">在黑板下方提交建议或调整。</p><template x-for="hint in project.hints.slice().reverse()" :key="hint.id"><div class="control-entry"><span class="badge gray" x-text="hint.control?.kind === 'directive' ? '指令' : '建议'"></span><p x-text="hint.content"></p><small x-text="controlState(hint.control?.state || '')"></small><button class="inline-link" x-show="hint.control && !['revoked','replaced'].includes(hint.control.state)" @click="revokeDevelopmentControl(hint.id)">撤销</button></div></template></section>
        <section class="panel-section"><h3>最近活动</h3><p class="muted" x-show="!developmentState.events.length">暂无活动记录。</p><template x-for="event in developmentState.events.slice(0,15)" :key="event.id"><div class="event-row"><span x-text="developmentText(event.detail || event.kind)"></span><time x-text="developmentTime(event.created_at)"></time></div></template></section>
      </aside>
    </div>
  </div></template>
</main>
</div>
<div class="overlay" x-show="showNewProject" :inert="folderOpen" x-cloak @click.self="if (!creatingProject) showNewProject = false" role="dialog" aria-modal="true" @keydown.tab="trapDialog($event)" aria-labelledby="create-title">
  <form class="modal" @submit.prevent="createProject()"><header class="modal-header"><h2 id="create-title">创建项目</h2><button class="quiet" type="button" @click="showNewProject = false" :disabled="creatingProject" aria-label="关闭创建项目"><svg class="icon"><use href="#icon-close"/></svg></button></header><div class="modal-body"><label>项目文件夹</label><button type="button" class="folder-picker" @click="pickProjectFolder()" :disabled="creatingProject"><svg class="icon"><use href="#icon-folder"/></svg><span x-text="newProject.directory ? '重新选择文件夹' : '选择项目文件夹'"></span></button><p class="chosen-path" x-show="newProject.directory" x-text="newProject.directory"></p><label for="project-name">项目名称</label><input id="project-name" x-model="newProject.name" placeholder="选择文件夹后自动填写，可修改" maxlength="200" :disabled="creatingProject"><p class="muted">创建后直接进入方案设计，再一起明确项目目标。空文件夹会自动建立 Git 初始基线。</p><p class="error" x-show="createError" x-text="createError" role="alert"></p></div><footer class="modal-footer"><button class="secondary" type="button" @click="showNewProject = false" :disabled="creatingProject">取消</button><button class="primary" :disabled="creatingProject || !newProject.directory" x-text="creatingProject ? '正在创建…' : '创建并开始设计'"></button></footer></form>
</div>
<div class="overlay folder-overlay" x-show="folderOpen" x-cloak @click.self="cancelFolder()" role="dialog" aria-modal="true" @keydown.tab="trapDialog($event)" aria-labelledby="folder-title">
  <section class="modal folder-modal">
    <header class="modal-header"><h2 id="folder-title">选择项目文件夹</h2><button class="quiet" @click="cancelFolder()" :disabled="folderCreating" aria-label="关闭文件夹选择"><svg class="icon"><use href="#icon-close"/></svg></button></header>
    <div class="folder-toolbar"><button class="secondary" @click="browseFolders('')" :disabled="folderLoading || folderCreating">此电脑</button><button class="quiet" @click="browseFolders(folderState.parent)" :disabled="folderLoading || folderCreating || folderState.parent === null">上一级</button><button class="secondary" x-ref="newFolderButton" @click="startNewFolder()" :disabled="folderLoading || folderCreating || !folderState.directory">新建文件夹</button><input class="search" type="search" x-model="folderSearch" aria-label="筛选当前目录的文件夹" placeholder="筛选当前目录…"></div>
    <nav class="folder-breadcrumbs" aria-label="当前文件夹位置"><template x-for="crumb in folderState.breadcrumbs" :key="crumb.directory"><button class="quiet" @click="browseFolders(crumb.directory)" :disabled="folderLoading || folderCreating" x-text="crumb.name"></button></template></nav>
    <form class="folder-create" x-show="newFolderVisible" @submit.prevent="createFolder()"><div><input x-ref="newFolderName" x-model="newFolderName" aria-label="新文件夹名称" placeholder="输入文件夹名称" maxlength="255" :disabled="folderCreating"><button class="primary" :disabled="folderCreating || !newFolderName.trim()" x-text="folderCreating ? '创建中…' : '创建'"></button><button type="button" class="quiet" @click="newFolderVisible = false; $refs.newFolderButton.focus()" :disabled="folderCreating">取消</button></div><p class="error" x-show="newFolderError" x-text="newFolderError" role="alert"></p></form>
    <div class="folder-list"><p class="loading" x-show="folderLoading">正在读取文件夹…</p><p class="error" x-show="folderError" x-text="folderError" role="alert"></p><div x-show="!folderLoading && !folderError"><template x-for="entry in filteredFolders()" :key="entry.directory"><button class="folder-entry" @click="browseFolders(entry.directory)" :disabled="folderCreating"><svg class="icon"><use href="#icon-folder"/></svg><span x-text="entry.name"></span><svg class="icon"><use href="#icon-arrow"/></svg></button></template><p class="folder-empty" x-show="!filteredFolders().length" x-text="folderSearch ? '没有匹配的子文件夹。' : '此目录没有子文件夹，可直接选择当前文件夹。'"></p></div></div>
    <footer class="modal-footer folder-footer"><p class="folder-current" x-text="folderState.directory || '请选择磁盘，再进入项目文件夹。'"></p><div><button class="secondary" @click="cancelFolder()" :disabled="folderCreating">取消</button><button class="primary" x-ref="confirmFolder" @click="confirmFolder()" :disabled="folderLoading || folderCreating || !!folderError || !folderState.directory">选择此文件夹</button></div></footer>
  </section>
</div>
<div class="overlay" x-show="developmentArtifact.open" x-cloak @click.self="developmentArtifact.open = false" role="dialog" aria-modal="true" @keydown.tab="trapDialog($event)" aria-labelledby="artifact-title"><section class="modal wide"><header class="modal-header"><h2 id="artifact-title" x-text="stageLabel(developmentArtifact.name)"></h2><button class="quiet" @click="developmentArtifact.open = false" aria-label="关闭预览"><svg class="icon"><use href="#icon-close"/></svg></button></header><div class="modal-body document-content"><template x-if="developmentArtifact.conversation"><section role="log" aria-label="任务运行详情"><p class="muted" x-text="developmentRunStatus(developmentArtifact.run)"></p><p class="error" x-show="developmentArtifact.error" x-text="developmentArtifact.error"></p><p class="muted" x-show="!developmentArtifact.text">正在读取已记录的运行内容…</p><template x-for="entry in taskRunEntries()" :key="entry.id"><article class="message"><template x-if="entry.kind === 'tool'"><div @toggle.capture="if ($event.target.matches('details.tool-call')) toolOpen[entry.id] = $event.target.open" x-html="toolHTML(entry)"></div></template><template x-if="entry.kind !== 'tool'"><div class="markdown" x-html="designMarkdown(entry.text)"></div></template></article></template></section></template><template x-if="developmentArtifact.markdown && !developmentArtifact.conversation"><div class="markdown" x-html="designMarkdown(developmentArtifact.text)"></div></template><template x-if="!developmentArtifact.markdown && !developmentArtifact.conversation"><pre x-text="developmentArtifact.text"></pre></template></div></section></div>
<div class="overlay" x-show="deleteTarget" x-cloak @click.self="if (!deletingProject) deleteTarget = null" role="dialog" aria-modal="true" @keydown.tab="trapDialog($event)" aria-labelledby="delete-project-title">
  <form class="modal" @submit.prevent="deleteProject()">
    <header class="modal-header"><h2 id="delete-project-title">删除项目</h2><button class="quiet" type="button" @click="deleteTarget = null" :disabled="deletingProject" aria-label="关闭删除确认">关闭</button></header>
    <div class="modal-body"><p>删除项目及其方案、任务和会话记录，此操作无法撤销。磁盘上的项目文件会保留。</p><label for="delete-project-name">输入项目名称以确认</label><p class="chosen-path" x-text="deleteTarget?.title"></p><input id="delete-project-name" x-model="deleteConfirmation" autocomplete="off" :disabled="deletingProject"><p class="error" role="alert" x-show="deleteError" x-text="deleteError"></p></div>
    <footer class="modal-footer"><button class="secondary" type="button" @click="deleteTarget = null" :disabled="deletingProject">取消</button><button class="primary" :disabled="deletingProject || !deleteTarget || deleteConfirmation !== deleteTarget.title" x-text="deletingProject ? '正在删除…' : '确认删除'"></button></footer>
  </form>
</div>
<div class="toast" :class="{'error-toast':toastType === 'error'}" x-show="toast" x-cloak role="status" x-text="toast"></div>
</body>
</html>
