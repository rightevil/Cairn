name: Build and release Windows desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: cairn/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --project cairn --extra desktop --group packaging
      - name: Check versions
        run: uv run --locked --project cairn python cairn/packaging/verify.py --versions-only
      - name: Test Python
        run: uv run --locked --project cairn pytest -q cairn/tests
      - name: Test browser logic
        shell: pwsh
        run: |
          $tests = (Get-ChildItem cairn/tests/test_*.cjs).FullName
          node --test $tests
      - name: Build portable application
        run: uv run --locked --project cairn python cairn/packaging/build.py
      - name: Verify portable application
        run: uv run --locked --project cairn python cairn/packaging/verify.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Cairn-windows-x64
          path: |
            cairn/dist/Cairn-*-windows-x64.zip
            cairn/dist/Cairn-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Cairn-windows-x64
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Cairn 二开阶段的 Windows 免安装桌面版快照。解压 ZIP 的完整目录后双击 `Cairn.exe`，请保留 `_internal` 和 `cairn-runtime.exe`。

          - 关闭窗口后在托盘运行；单击恢复，右键打开或退出。
          - 设置页统一管理供应商、密钥、模型与 Agent，保存后热加载。
          - 内置 designgod / BMAD / grilling，以及节点流实施进度可视化。
          - 附带 SHA-256 校验文件；包内不包含个人配置、密钥或运行数据。

          需要 Windows x64、Microsoft Edge WebView2 Runtime，以及本机 Git 和所选 Agent CLI。此便携包未做代码签名，Windows 可能提示未知发布者。

          **本 fork 已停止二次开发，后续转向 [Devloom](https://github.com/rightevil/devloom) 重新设计开发。Devloom 当前处于概念与设计阶段。本 Release 保留作历史参考。**

          NOTES
          printf '\n完整提交记录见 [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md)。\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> release-notes.md
          gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 \
            --verify-tag --title "Cairn $RELEASE_TAG" --notes-file release-notes.md
