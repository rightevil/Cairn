# The single dispatcher example. Runtime values come from start-cairn.ps1.
server: http://127.0.0.1:8000
worker_token_file: .cairn/data/cairn.worker-token

runtime:
  execution: local
  worker_healthcheck: disabled
  prompt_group: development
  max_workers: 3
  max_project_workers: 3
  # Global role limits across projects; architect reviews/arbitration use review capacity.
  # Overrides: CAIRN_MAX_IMPLEMENTERS / CAIRN_MAX_REVIEWERS in the launcher environment.
  max_implementers: 2
  max_reviewers: 1
  max_running_projects: 2
  interval: 3
  healthcheck_timeout: 15

local:
  workspace_root: .cairn/workspaces
  completed_action: keep

# Design workflows are bundled from designgod; no external Skill repository is needed.

common_env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

tasks:
  development_timeout: 3600
  bootstrap: {timeout: 120, conclude_timeout: 30}
  reason: {timeout: 45}
  explore: {timeout: 600, conclude_timeout: 120}

workers:
  - name: strong-design
    type: claudecode
    tier: strong
    roles: [planner, architect, implementer]
    max_running: 1
    priority: 0
    env_from:
      ANTHROPIC_BASE_URL: MAGPIE_ANTHROPIC_BASE_URL
      ANTHROPIC_AUTH_TOKEN: MAGPIE_API_KEY
      ANTHROPIC_MODEL: MAGPIE_STRONG_MODEL

  - name: standard-development
    type: claudecode
    tier: standard
    roles: [implementer, reviewer]
    max_running: 2
    priority: 0
    env_from:
      ANTHROPIC_BASE_URL: MAGPIE_ANTHROPIC_BASE_URL
      ANTHROPIC_AUTH_TOKEN: MAGPIE_API_KEY
      ANTHROPIC_MODEL: MAGPIE_STANDARD_MODEL
