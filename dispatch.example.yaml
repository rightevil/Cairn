# Host CLI execution, with both model tiers routed through your Magpie installation.
# Set MAGPIE_ANTHROPIC_BASE_URL, MAGPIE_API_KEY, MAGPIE_STRONG_MODEL,
# MAGPIE_STANDARD_MODEL in the dispatcher's environment. No keys are stored here.
# Use the actual endpoint/model IDs configured in Magpie; do not append /v1/messages.
# env_from values are ENVIRONMENT VARIABLE NAMES, not URLs or model IDs.
# To write literal values, replace env_from with env, for example:
# env:
#   ANTHROPIC_BASE_URL: 'http://127.0.0.1:3425'
#   ANTHROPIC_AUTH_TOKEN: 'your-magpie-key'
#   ANTHROPIC_MODEL: 'group/your-model-id'
server: http://127.0.0.1:8000

runtime:
  execution: local
  worker_healthcheck: disabled  # startup still checks the CLI executable
  prompt_group: development
  max_workers: 3
  max_project_workers: 3
  max_running_projects: 2
  interval: 3
  healthcheck_timeout: 15

local:
  workspace_root: .cairn/workspaces  # relative to this YAML, retained on stop/completion
  completed_action: keep

# Only single-call/process timeouts; no project budget or cumulative attempt limit.
tasks:
  development_timeout: 3600
  bootstrap: {timeout: 120, conclude_timeout: 30}
  reason: {timeout: 45}
  explore: {timeout: 600, conclude_timeout: 120}

# Optional for a nondefault serve --db-path; otherwise the default DB credential is read.
# worker_token_file: .cairn/cairn.worker-token

workers:
  - name: strong-design
    type: claudecode
    tier: strong
    roles: [planner, architect]
    max_running: 1
    priority: 0
    env_from:
      ANTHROPIC_BASE_URL: MAGPIE_ANTHROPIC_BASE_URL
      ANTHROPIC_AUTH_TOKEN: MAGPIE_API_KEY
      ANTHROPIC_MODEL: MAGPIE_STRONG_MODEL
    # Windows: npm .cmd shims resolve to the native .exe or legacy Node entry.
    # For another installation, set a native argv prefix with absolute paths:

  - name: standard-development
    type: claudecode
    tier: standard
    roles: [implementer, reviewer]
    max_running: 2
    priority: 0
    env_from:
      ANTHROPIC_BASE_URL: MAGPIE_ANTHROPIC_BASE_URL
      ANTHROPIC_AUTH_TOKEN: MAGPIE_API_KEY
      ANTHROPIC_MODEL: MAGPIE_STANDARD_MODEL

# Existing alternatives: type: codex (CODEX_MODEL, CODEX_BASE_URL, OPENAI_API_KEY),
# type: pi (PI_MODEL, PI_BASE_URL, PI_API_KEY, PI_PROVIDER_API).
# Use separate role profiles, not two dispatchers for the same project.
